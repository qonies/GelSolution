<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水弹波箱运作数据模拟</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--line:#e2e5ea;--txt:#1c2330;--sub:#6b7484;--ok:#1a7f37;--warn:#b45309;--bad:#b91c1c;--accent:#2458c6}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:#16233c;color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:baseline}
header h1{font-size:17px;margin:0;font-weight:600}
header span{font-size:12px;color:#9db0d0}
main{display:flex;gap:14px;padding:14px;align-items:flex-start}
#params{width:340px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;position:sticky;top:10px;max-height:calc(100vh - 24px);overflow:auto}
#results{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.cardbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card .k{font-size:12px;color:var(--sub)}
.card .v{font-size:19px;font-weight:600;margin-top:2px}
.card .v.bad{color:var(--bad)} .card .v.warn{color:var(--warn)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.panel h2{font-size:14px;margin:0 0 8px}
.group{margin-bottom:10px}
.group label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.row{display:flex;gap:8px;align-items:center}
select,input[type=number],textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff;color:var(--txt)}
input[type=range]{width:100%;accent-color:var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.psec{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:10px;background:#fcfdfe}
.psec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.psec-h b{font-size:13px;white-space:nowrap}
.psel{width:auto;max-width:158px;min-width:96px;font-size:12px;padding:4px 6px}
details{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
details summary{cursor:pointer;font-size:13px;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:left;white-space:nowrap}
th{color:var(--sub);font-weight:500;background:#fafbfc}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#fff}
.b-ok{background:var(--ok)} .b-warn{background:var(--warn)} .b-bad{background:var(--bad)}
.checkline{padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.5}
.checkline b{margin-right:6px}
ol.concl{margin:4px 0 0;padding-left:20px} ol.concl li{margin:4px 0;line-height:1.5}
#err{display:none;background:#fdecec;color:var(--bad);border:1px solid #f3b6b6;border-radius:8px;padding:8px 12px}
#tl{position:relative;height:30px;background:#eef1f6;border-radius:6px;margin:14px 0 20px}
#tl .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--accent)}
#tl .mk.red{background:var(--bad)}
#tl .cap{position:absolute;top:32px;font-size:11px;color:var(--sub)}
.buttons{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
button{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#status{font-size:12px;color:var(--sub)}
textarea#report{height:340px;font-family:Consolas,monospace;font-size:12px;white-space:pre;resize:vertical}
.scroll{max-height:430px;overflow:auto;border:1px solid var(--line);border-radius:8px}
tr.hl td{background:#eaf1ff}
.h2r{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<header><h1>水弹波箱运作数据模拟</h1><span>本地网页界面 · 实时数据模拟 · 无动画 · 通用二号波</span></header>
<main>
<section id="params">
  <div class="psec">
    <div class="psec-h"><b>电机参数</b><select id="preset_电机" class="psel"><option value="">自定义</option></select></div>
    <div class="group"><label>电机型号（选型后按性能曲线计算负载转速；标称转速与负载系数随之锁定）</label>
      <select id="motorModel">
        <option value="">固定转速（手动输入下方转速）</option>
        <option value="超力无刷4W8" data-rpm="48000">超力无刷 4W8（空载 48000 RPM / 11.1V）</option>
        <option value="超力无刷3W9" data-rpm="39000">超力无刷 3W9（空载 39000 RPM / 11.1V）</option>
        <option value="超力有刷3W5" data-rpm="35500">超力有刷 3W5（空载 35500 RPM / 11.1V）</option>
        <option value="超力有刷3W3" data-rpm="32800">超力有刷 3W3（空载 32800 RPM / 11.1V）</option>
      </select></div>
    <div class="group"><label>电机标称转速 RPM（仅固定转速模式可改；选型号后锁定为其曲线标称转速）</label>
      <div class="row"><input type="range" id="rpmS" min="5000" max="60000" step="500" style="flex:1">
        <input type="number" id="rpm" min="1000" max="100000" step="100" style="width:92px"></div></div>
    <div class="group"><label>负载系数（仅固定转速模式可改，默认 0.8；选型号后固定为 1）</label>
      <div class="row"><input type="range" id="lfS" min="0.3" max="1" step="0.05" style="flex:1">
        <input type="number" id="lf" min="0.1" max="1" step="0.05" style="width:70px" placeholder="自动"></div></div>
  </div>

  <div class="psec">
    <div class="psec-h"><b>齿轮参数</b><select id="preset_齿轮" class="psel"><option value="">自定义</option></select></div>
    <div class="group duo">
      <div><label>齿轮比</label><select id="ratio">
        <option selected>13:1</option><option>16:1</option><option>18:1</option></select></div>
      <div><label>天梯齿数（原装 13.5；半齿计整齿，11.5→12）</label><input type="number" id="dvTappet" step="0.5"></div>
    </div>
    <div class="group duo">
      <div><label>前切齿数（切蛋糕齿）</label><input type="number" id="fc" min="0" max="6" step="1" value="0"></div>
      <div><label>后切齿数</label><input type="number" id="rc" min="0" max="6" step="1" value="0"></div>
    </div>
  </div>

  <div class="psec">
    <div class="psec-h"><b>电池参数</b><select id="preset_电池" class="psel"><option value="">自定义</option></select></div>
    <div class="group"><label>电池（选配，须先在电机参数选择型号）</label><select id="battCells">
      <option value="">不启用</option><option value="2">2S（满电 8.4V）</option>
      <option value="3">3S（满电 12.6V）</option><option value="4">4S（满电 16.8V）</option>
      <option value="6">6S（满电 25.2V）</option></select></div>
    <div class="group duo">
      <div><label>容量 mAh</label><input type="number" id="battCap" step="100" placeholder="1400"></div>
      <div><label>放电倍率 C（缺省 30C）</label><input type="number" id="battC" step="5" placeholder="30"></div>
    </div>
  </div>
  <div class="psec">
    <div class="psec-h"><b>气缸参数</b><select id="preset_气缸" class="psel"><option value="">自定义</option></select></div>
    <div class="group"><label>气缸类型（开孔位置，以满行程标定、固定于缸体）</label><select id="cyl">
      <option selected>50%</option><option>60%</option><option>70%</option><option>80%</option><option>100%</option></select></div>
    <div class="group duo">
      <div><label>气缸内径 mm（✅实测 23.8）</label><input type="number" id="dvBore" step="0.1"></div>
      <div><label>气缸长度 mm（✅实测 72.5）</label><input type="number" id="dvCylLen" step="1"></div>
    </div>
    <div class="group duo">
      <div><label>气缸余隙容积 cm³</label><input type="number" id="dvDead" step="0.1"></div>
      <div><label>开孔段保留系数（0=全漏，1=不漏）</label><input type="number" id="dvPortRet" step="0.05"></div>
    </div>
  </div>

  <div class="psec">
    <div class="psec-h"><b>弹簧参数</b><select id="preset_弹簧" class="psel"><option value="">自定义</option></select></div>
    <div class="group duo">
      <div><label>弹簧硬度</label><select id="spring">
        <option>M75</option><option>M80</option><option>M85</option><option selected>M90</option>
        <option>M95</option><option>M100</option><option>M110</option></select></div>
      <div><label>弹簧预压 mm</label><input type="number" id="dvPreload" step="0.5"></div>
    </div>
    <div class="group duo">
      <div><label>活塞满行程 mm（✅实测 60.5）</label><input type="number" id="dvStroke" step="1"></div>
      <div><label>活塞质量 g</label><input type="number" id="dvPistonMass" step="0.5"></div>
    </div>
    <div class="group"><label>撞击回弹系数（天梯撞缸头反弹速度比，回位稳定模型）</label>
      <input type="number" id="dvResti" step="0.05"></div>
  </div>

  <div class="psec">
    <div class="psec-h"><b>其他参数</b></div>
    <div class="group duo">
      <div><label>供蛋方式</label><select id="feedMode">
        <option value="普通波轮" selected>普通波轮（≤30发/秒）</option><option value="高级波轮">高级波轮（≤60发/秒）</option><option value="压力弹匣">压力弹匣（≤80发/秒）</option></select></div>
      <div><label>内管管径</label><select id="bore">
        <option value="7.3">7.3</option><option selected value="7.5">7.5</option></select></div>
    </div>
    <div class="group"><label>内管长度 mm</label>
      <div class="row"><input type="range" id="blS" min="100" max="600" step="10" style="flex:1">
        <input type="number" id="bl" min="20" max="800" step="5" style="width:92px"></div></div>
    <div class="group duo">
      <div><label>水弹直径（不得大于管径）</label><select id="ball">
        <option selected value="7.2">7.2</option><option value="7.3">7.3</option></select></div>
      <div><label><input type="checkbox" id="modDelay" style="width:auto;vertical-align:middle"> 安装延时器（加宽供蛋窗口）</label></div>
    </div>
    <div class="group"><label><input type="checkbox" id="modFlag" style="width:auto;vertical-align:middle"> 切拉桥旗（切S尾：推嘴更早更快恢复，需强拉桥簧）</label></div>
    <details><summary>判定阈值（已预填系统默认值，可参考或修改）</summary>
      <div class="group duo"><div><label>打齿安全裕量 ms</label><input type="number" id="thClash" step="0.1"></div>
        <div><label>气密最小裕量 ms</label><input type="number" id="thSeal" step="0.1"></div></div>
      <div class="group duo"><div><label>初速警告阈值 m/s</label><input type="number" id="thV" step="1"></div>
        <div><label>管长匹配比例</label><input type="number" id="thBarrel" step="0.05"></div></div>
      <div class="group duo"><div><label>压气不足阈值</label><input type="number" id="thAir" step="0.05"></div>
        <div><label>最少保留啮合齿数</label><input type="number" id="thTeeth" step="1"></div></div>
    </details>
    <details><summary>其他器件参数（已预填系统默认值，可修改 / 实测校准）</summary>
      <div style="font-size:12px;color:var(--sub);margin-bottom:6px">以下为通用二号波默认参数（含【估算】值，报告尾部附估算清单）；气缸/弹簧/活塞相关器件参数已移至上方对应分区。清空某项 = 恢复该系统默认。</div>
      <div class="group duo"><div><label>气动效率</label><input type="number" id="dvEff" step="0.01"></div>
        <div><label>水弹质量 g</label><input type="number" id="dvMass" step="0.01"></div></div>
      <div class="group duo"><div><label>泄气损失系数</label><input type="number" id="dvLeak" step="0.1"></div>
        <div><label>推嘴回位起始角 °</label><input type="number" id="dvRetS" step="1"></div></div>
      <div class="group duo"><div><label>推嘴回位完成角 °</label><input type="number" id="dvRetE" step="1"></div>
        <div><label>延时器占孔数（1孔=36°，装延时器=2孔）</label><input type="number" id="dvDelay" step="0.5"></div></div>
      <div class="group duo"><div><label>切拉桥旗提前 ms</label><input type="number" id="dvFlag" step="0.5"></div><div></div></div>
    </details>
  </div>
  <div class="buttons">
    <button class="primary" id="btnSim">立即模拟</button>
    <button id="btnExport">导出JSON</button>
    <button id="btnImport">导入JSON</button>
    <input type="file" id="fileIn" accept=".json" style="display:none">
    <span id="status"></span>
  </div>
</section>

<section id="results">
  <div id="err"></div>
  <div class="cardbox" id="cards"></div>
  <div class="panel"><h2>判定结果</h2><div id="checks"></div></div>
  <div class="panel"><h2>结论建议</h2><ol class="concl" id="concl"></ol></div>
  <div class="panel"><h2>单循环时序（0 → 周期）</h2>
    <div id="tl"></div>
    <div class="scroll"><table id="evTable"></table></div></div>
  <div class="panel"><h2>切齿方案枚举对比（前切/后切 0~3 齿，按综合裕量排序）</h2>
    <div class="scroll"><table id="schTable"></table></div></div>
  <div class="panel"><h2 class="h2r"><span>完整文本报告</span>
    <button id="btnCopy">复制</button></h2>
    <textarea id="report" readonly></textarea></div>
</section>

</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
let timer = null, current = {};
let DEVDEF = {}, THDEF = {};   // 系统默认值（/api/default 下发，供输入框预填与回退）

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function showErr(msg){const e=$("err");if(msg){e.textContent="✗ "+msg;e.style.display="block";}else{e.style.display="none";}}
function cutTag(f,r){if(!f&&!r)return"无切";let p=[];if(f)p.push("前切"+f);if(r)p.push("后切"+r);return p.join("+");}

/* ---- 收集表单 → 配置JSON（空值不下发，走引擎默认） ---- */
function collect(){
  const num = id => {const v=$(id).value.trim();return v===""?null:parseFloat(v);};
  const mm = $("motorModel").value;
  const motorBlock = {};
  if(mm){
    motorBlock["型号"] = mm;   // 曲线模式：负载系数固定 1、标称转速锁定为曲线值（不下发）
  }else{
    motorBlock["标称转速RPM"] = parseFloat($("rpm").value)||0;
    const lfV = num("lf");
    if(lfV!==null) motorBlock["负载系数"] = lfV;   // 留空 = 默认 0.8（仅固定转速模式）
  }
  const cfg = {
    "电机": motorBlock,
    "齿轮比":$("ratio").value,
    "切齿":{"前切齿数":parseInt($("fc").value)||0,"后切齿数":parseInt($("rc").value)||0},
    "气缸类型":$("cyl").value,"弹簧":$("spring").value,
    "内管长度mm":parseFloat($("bl").value)||210,
    "内管管径":$("bore").value,"水弹直径":$("ball").value,
    "供蛋":{"方式":$("feedMode").value},
    "器件参数覆盖":{},"判定阈值覆盖":{}
  };
  if($("battCells").value){
    cfg["电池"] = {"电芯数": parseInt($("battCells").value),
                   "容量mAh": num("battCap")||1400,
                   "放电倍率": num("battC")||30};
  }
  const mods = {};
  if($("modDelay").checked) mods["安装延时器"] = true;
  if($("modFlag").checked) mods["切拉桥旗"] = true;
  if(Object.keys(mods).length) cfg["改装"] = mods;
  const devMap={"dvEff":"气动效率","dvMass":"水弹质量g","dvBore":"气缸内径mm","dvCylLen":"气缸长度mm",
                "dvPortRet":"开孔段保留系数","dvResti":"撞击回弹系数",
                "dvDead":"气缸余隙容积cm3","dvPreload":"弹簧预压mm","dvLeak":"泄气损失系数",
                "dvStroke":"活塞满行程mm","dvTappet":"天梯齿数","dvPistonMass":"活塞质量g",
                "dvRetS":"推嘴回位起始角","dvRetE":"推嘴回位完成角",
                "dvDelay":"延时器占孔数","dvFlag":"切拉桥旗提前ms"};
  for(const [id,k] of Object.entries(devMap)){const v=num(id);if(v!==null)cfg["器件参数覆盖"][k]=v;}
  const thMap={"thClash":"打齿安全裕量ms","thSeal":"气密最小裕量ms","thV":"初速警告阈值m/s",
               "thBarrel":"管长匹配比例","thAir":"压气不足阈值","thTeeth":"最少保留啮合齿数"};
  for(const [id,k] of Object.entries(thMap)){const v=num(id);if(v!==null)cfg["判定阈值覆盖"][k]=v;}
  return cfg;
}

/* ---- 表单 ← 配置JSON（导入用） ---- */
function applyConfig(c){
  if(c["电机"]){
    $("motorModel").value=c["电机"]["型号"]||"";
    if(!c["电机"]["型号"])$("rpm").value=c["电机"]["标称转速RPM"];
    $("lf").value=(!c["电机"]["型号"]&&c["电机"]["负载系数"]!=null)?c["电机"]["负载系数"]:"";
    syncMotorLock();
  }
  if(c["电池"]){$("battCells").value=String(c["电池"]["电芯数"]||"");
    $("battCap").value=c["电池"]["容量mAh"]!=null?c["电池"]["容量mAh"]:"";
    $("battC").value=c["电池"]["放电倍率"]!=null?c["电池"]["放电倍率"]:"";}
  else{$("battCells").value="";$("battCap").value="";$("battC").value="";}
  $("modDelay").checked=!!(c["改装"]&&c["改装"]["安装延时器"]);
  $("modFlag").checked=!!(c["改装"]&&c["改装"]["切拉桥旗"]);
  if(c["齿轮比"])$("ratio").value=c["齿轮比"];
  if(c["切齿"]){$("fc").value=c["切齿"]["前切齿数"]||0;$("rc").value=c["切齿"]["后切齿数"]||0;}
  if(c["气缸类型"])$("cyl").value=c["气缸类型"];
  if(c["弹簧"])$("spring").value=c["弹簧"];
  if(c["内管长度mm"]!=null)$("bl").value=c["内管长度mm"];
  if(c["内管管径"])$("bore").value=String(c["内管管径"]);
  if(c["水弹直径"])$("ball").value=String(c["水弹直径"]);
  if(c["供蛋"]){let fm=c["供蛋"]["方式"]||"普通波轮";
    if(fm==="波轮")fm="普通波轮"; if(fm==="压力")fm="压力弹匣";
    $("feedMode").value=fm;}
  else{$("feedMode").value="普通波轮";}
  const revDev={"气动效率":"dvEff","水弹质量g":"dvMass","气缸内径mm":"dvBore","气缸长度mm":"dvCylLen",
                "开孔段保留系数":"dvPortRet","撞击回弹系数":"dvResti",
                "气缸余隙容积cm3":"dvDead","弹簧预压mm":"dvPreload","泄气损失系数":"dvLeak",
                "活塞满行程mm":"dvStroke","天梯齿数":"dvTappet","活塞质量g":"dvPistonMass",
                "推嘴回位起始角":"dvRetS","推嘴回位完成角":"dvRetE",
                "延时器占孔数":"dvDelay","切拉桥旗提前ms":"dvFlag"};
  const revTh={"打齿安全裕量ms":"thClash","气密最小裕量ms":"thSeal","初速警告阈值m/s":"thV",
               "管长匹配比例":"thBarrel","压气不足阈值":"thAir","最少保留啮合齿数":"thTeeth"};
  for(const k in revDev)$(revDev[k]).value=(c["器件参数覆盖"]&&c["器件参数覆盖"][k]!=null)?c["器件参数覆盖"][k]:(DEVDEF[k]!=null?DEVDEF[k]:"");
  for(const k in revTh)$(revTh[k]).value=(c["判定阈值覆盖"]&&c["判定阈值覆盖"][k]!=null)?c["判定阈值覆盖"][k]:(THDEF[k]!=null?THDEF[k]:"");
  for(const sec of SECS)$("preset_"+sec).value="";   // 导入/载入配置 → 分区预设转为「自定义」
  syncSliders();
}

function syncSliders(){
  $("rpmS").value=Math.min(60000,Math.max(5000,$("rpm").value||30000));
  $("lfS").value=$("lf").value||0.8;
  $("blS").value=Math.min(600,Math.max(100,$("bl").value||210));
}

/* ---- 曲线模式锁定（选型号后：标称转速=该电机曲线值、负载系数=1，均不可修改） ---- */
function syncMotorLock(){
  const mm=$("motorModel").value, locked=!!mm;
  if(locked){
    $("rpm").value=$("motorModel").selectedOptions[0].getAttribute("data-rpm")||"";
    $("lf").value="";
  }
  $("rpm").disabled=locked; $("rpmS").disabled=locked;
  $("lf").disabled=locked;  $("lfS").disabled=locked;
  $("lfS").value=$("lf").value||0.8;
}

/* ---- 实时模拟 ---- */
async function simulate(){
  $("status").textContent="模拟中…";
  const cfg=collect(); current=cfg;
  try{
    const r=await fetch("/api/simulate",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(cfg)});
    const d=await r.json();
    if(!d.ok){showErr(d.error||"模拟失败");$("status").textContent="";return;}
    showErr(null); render(d);
    $("status").textContent="已更新 "+new Date().toLocaleTimeString();
  }catch(e){showErr("请求失败："+e);$("status").textContent="";}
}
function schedule(){clearTimeout(timer);timer=setTimeout(simulate,150);}
</script>
<script>
/* ---- 渲染结果 ---- */
function render(d){
  const o=d.overview, badge={"通过":"b-ok","警告":"b-warn","危险":"b-bad"};
  const cards=[
    ["周期 / 射速", o.period_ms.toFixed(1)+" ms · "+o.rof_rps.toFixed(1)+" 发/s",
      o.rof_rps>o.feed_max_rps?"bad":""],
    ["水弹初速", o.v_m_s.toFixed(1)+" m/s", o.v_m_s>o.velocity_warn_ms?"bad":""],
    ["回位裕量(打齿)", o.return_margin_ms.toFixed(2)+" ms",
      o.return_margin_ms<0?"bad":(o.return_margin_ms<o.gear_clash_margin_ms?"warn":"")],
    ["气密裕量", o.seal_margin_ms.toFixed(2)+" ms",
      o.seal_margin_ms<0?"bad":(o.seal_margin_ms<o.air_seal_margin_ms?"warn":"")],
    ["供蛋窗口", o.window_ms.toFixed(1)+" ms", ""],
    ["压气指数", o.air_index.toFixed(2), o.air_index<o.low_air_index?"warn":""],
    ["活塞行程", o.stroke_mm.toFixed(1)+" mm（"+Math.round(o.stroke_ratio*100)+"%）", ""],
    ["有效推力 / 内管", o.useful_stroke_mm.toFixed(0)+" / "+o.barrel_length_mm.toFixed(0)+" mm",
      o.useful_stroke_mm<o.barrel_length_mm*o.barrel_match_ratio?"warn":""]
  ];
  if(o.torque_peak_ratio!=null){
    cards.push(["电机负载(峰值/堵转)", (o.torque_peak_ratio*100).toFixed(0)+"% · "+o.loaded_rpm.toFixed(0)+" RPM",
      o.motor_stall?"bad":(o.torque_peak_ratio>0.8?"warn":"")]);
  }
  if(o.batt_sag!=null){
    const sagPct=(1-o.batt_sag)*100;
    cards.push(["电池(电压保持/续航)", (o.batt_sag*100).toFixed(0)+"% · 约"+(o.batt_shots||0).toFixed(0)+"发",
      sagPct>25?"bad":(sagPct>10?"warn":"")]);
  }
  $("cards").innerHTML=cards.map(c=>
    '<div class="card"><div class="k">'+esc(c[0])+'</div><div class="v '+c[2]+'">'+esc(c[1])+"</div></div>").join("");

  $("checks").innerHTML=d.checks.map(c=>
    '<div class="checkline"><span class="badge '+(badge[c.level]||"")+'">'+esc(c.level)+
    "</span><b>"+esc(c.name)+"</b>"+esc(c.detail)+"</div>").join("");

  $("concl").innerHTML=d.conclusions.map(t=>"<li>"+esc(t)+"</li>").join("");

  /* 时序轴（静态标记，无动画） */
  const P=o.period_ms;
  let marks=d.events.map(ev=>{
    const x=Math.min(ev.t,P)/P*100, red=ev.t>P;
    return '<div class="mk'+(red?" red":"")+'" style="left:'+x.toFixed(2)+'%" title="'+
      esc(ev.desc)+"（"+ev.t.toFixed(2)+" ms"+(red?"，超出本周期":"")+'）"></div>';
  }).join("");
  $("tl").innerHTML=marks+'<div class="cap" style="left:0">0</div>'+
    '<div class="cap" style="right:0">周期 '+P.toFixed(1)+" ms</div>";

  $("evTable").innerHTML="<tr><th>时刻 ms</th><th>扇齿角度</th><th>事件</th></tr>"+
    d.events.map(ev=>"<tr><td class='num'>"+ev.t.toFixed(2)+"</td><td>"+
      (ev.angle!=null?ev.angle.toFixed(1)+"°":"-")+"</td><td>"+esc(ev.desc)+"</td></tr>").join("");

  const curF=(current["切齿"]||{})["前切齿数"]||0, curR=(current["切齿"]||{})["后切齿数"]||0;
  $("schTable").innerHTML="<tr><th>方案</th><th>行程mm</th><th>回位裕量ms</th><th>气密裕量ms</th>"+
    "<th>供蛋窗口ms</th><th>初速m/s</th><th>判定/问题</th></tr>"+
    d.schemes.map(s=>{
      const hl=(s.front_cut===curF&&s.rear_cut===curR)?" class='hl'":"";
      return "<tr"+hl+"><td>"+esc(cutTag(s.front_cut,s.rear_cut))+"</td>"+
        "<td class='num'>"+s.stroke_mm.toFixed(1)+"</td>"+
        "<td class='num'>"+s.return_margin_ms.toFixed(2)+"</td>"+
        "<td class='num'>"+s.seal_margin_ms.toFixed(2)+"</td>"+
        "<td class='num'>"+s.window_ms.toFixed(1)+"</td>"+
        "<td class='num'>"+s.v_m_s.toFixed(1)+"</td>"+
        "<td><span class='badge "+(badge[s.level]||"")+"'>"+esc(s.level)+"</span> "+
        (s.problems==="无"?"":esc(s.problems))+"</td></tr>";
    }).join("");

  $("report").value=d.report_text;
}

/* ---- 参数分区预设（configs/presets/<分区>/<名称>.json，GET /api/presets 下发；
   选择预设 = 整区载入（未列出的参数恢复默认），手动修改任意输入自动转「自定义」） ---- */
const SECS = ["电机", "齿轮", "电池", "气缸", "弹簧"];
let PRESETS = {};
function devDef(k){return DEVDEF[k]!=null?DEVDEF[k]:"";}
function applyPreset(sec,name){
  const p=(PRESETS[sec]||[]).find(x=>x["名称"]===name);
  if(!p||p["错误"])return;
  const m=p["参数"]||{};
  if(sec==="电机"){
    if(m["型号"]){$("motorModel").value=m["型号"];}
    else{
      $("motorModel").value="";
      $("rpm").value=(m["标称转速RPM"]!=null)?m["标称转速RPM"]:30000;
      $("lf").value=(m["负载系数"]!=null)?m["负载系数"]:"";
    }
    syncMotorLock();
  }else if(sec==="齿轮"){
    $("ratio").value=m["齿轮比"]||"13:1";
    $("fc").value=(m["前切齿数"]!=null)?m["前切齿数"]:0;
    $("rc").value=(m["后切齿数"]!=null)?m["后切齿数"]:0;
    $("dvTappet").value=(m["天梯齿数"]!=null)?m["天梯齿数"]:devDef("天梯齿数");
  }else if(sec==="电池"){
    $("battCells").value=(m["电芯数"]!=null)?String(m["电芯数"]):"";
    $("battCap").value=(m["容量mAh"]!=null)?m["容量mAh"]:"";
    $("battC").value=(m["放电倍率"]!=null)?m["放电倍率"]:"";
  }else if(sec==="气缸"){
    $("cyl").value=m["气缸类型"]||"50%";
    $("dvBore").value=(m["气缸内径mm"]!=null)?m["气缸内径mm"]:devDef("气缸内径mm");
    $("dvCylLen").value=(m["气缸长度mm"]!=null)?m["气缸长度mm"]:devDef("气缸长度mm");
    $("dvDead").value=(m["气缸余隙容积cm3"]!=null)?m["气缸余隙容积cm3"]:devDef("气缸余隙容积cm3");
    $("dvPortRet").value=(m["开孔段保留系数"]!=null)?m["开孔段保留系数"]:devDef("开孔段保留系数");
  }else if(sec==="弹簧"){
    $("spring").value=m["弹簧"]||"M90";
    $("dvPreload").value=(m["弹簧预压mm"]!=null)?m["弹簧预压mm"]:devDef("弹簧预压mm");
    $("dvStroke").value=(m["活塞满行程mm"]!=null)?m["活塞满行程mm"]:devDef("活塞满行程mm");
    $("dvPistonMass").value=(m["活塞质量g"]!=null)?m["活塞质量g"]:devDef("活塞质量g");
    $("dvResti").value=(m["撞击回弹系数"]!=null)?m["撞击回弹系数"]:devDef("撞击回弹系数");
  }
  syncSliders();schedule();
}
function fillPresetSelects(){
  for(const sec of SECS){
    const sel=$("preset_"+sec), cur=sel.value;
    sel.innerHTML='<option value="">自定义</option>'+(PRESETS[sec]||[]).map(p=>
      '<option value="'+esc(p["名称"])+'"'+(p["错误"]?" disabled":"")+'>'+
      esc(p["名称"])+(p["错误"]?"（文件错误）":"")+"</option>").join("");
    if(cur)sel.value=cur;
  }
}
function markCustom(sec){$("preset_"+sec).value="";}

/* ---- 事件绑定与初始化 ---- */
function bind(){
  const pairs=[["rpmS","rpm"],["lfS","lf"],["blS","bl"]];
  for(const [sId,nId] of pairs){
    $(sId).addEventListener("input",()=>{$(nId).value=$(sId).value;schedule();});
    $(nId).addEventListener("input",()=>{syncSliders();schedule();});
  }
  $("motorModel").addEventListener("change",()=>{syncMotorLock();schedule();});
  for(const id of ["battCells","battCap","battC","modDelay","modFlag","ratio","cyl","spring","feedMode","fc","rc","bore","ball",
                   "thClash","thSeal","thV","thBarrel","thAir","thTeeth",
                   "dvEff","dvMass","dvBore","dvCylLen","dvDead","dvPortRet","dvLeak","dvStroke",
                   "dvTappet","dvPistonMass","dvPreload","dvResti","dvRetS","dvRetE","dvDelay","dvFlag"])
    $(id).addEventListener("input",schedule);
  $("btnSim").addEventListener("click",simulate);
  $("btnExport").addEventListener("click",()=>{
    const blob=new Blob([JSON.stringify(current,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="波箱配置.json";a.click();URL.revokeObjectURL(a.href);});
  $("btnImport").addEventListener("click",()=>$("fileIn").click());
  $("fileIn").addEventListener("change",e=>{
    const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{try{applyConfig(JSON.parse(rd.result));simulate();}
                   catch(err){showErr("JSON 解析失败："+err);}};
    rd.readAsText(f,"utf-8");e.target.value="";});
  $("btnCopy").addEventListener("click",()=>{
    navigator.clipboard.writeText($("report").value).then(()=>{
      $("btnCopy").textContent="已复制";setTimeout(()=>$("btnCopy").textContent="复制",1200);});});
  for(const sec of SECS){
    $("preset_"+sec).addEventListener("change",()=>{
      const v=$("preset_"+sec).value;
      if(v)applyPreset(sec,v);
    });
  }
  const SEC_INPUTS={"电机":["motorModel","rpm","rpmS","lf","lfS"],
                    "齿轮":["ratio","fc","rc","dvTappet"],
                    "电池":["battCells","battCap","battC"],
                    "气缸":["cyl","dvBore","dvCylLen","dvDead","dvPortRet"],
                    "弹簧":["spring","dvPreload","dvStroke","dvPistonMass","dvResti"]};
  for(const sec in SEC_INPUTS)for(const id of SEC_INPUTS[sec])
    $(id).addEventListener("input",()=>markCustom(sec));
}

bind();
fetch("/api/presets").then(r=>r.json()).then(d=>{PRESETS=d||{};fillPresetSelects();}).catch(()=>{});
fetch("/api/default").then(r=>r.json()).then(c=>{
  DEVDEF=Object.assign({},c["器件参数覆盖"]||{});
  THDEF=Object.assign({},c["判定阈值覆盖"]||{});
  applyConfig(c);simulate();
});
</script>


</body>
</html>
